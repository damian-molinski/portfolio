name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DART_SDK: 3.13.2

jobs:
  check:
    name: Analyze, format, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up just
        uses: extractions/setup-just@v4

      - name: Restore the pub cache
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ env.DART_SDK }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ env.DART_SDK }}-

      - name: Install the Jaspr CLI
        run: |
          dart pub global activate jaspr_cli 0.23.4
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install Dart dependencies
        run: dart pub get

      - name: Install Node dependencies
        run: npm ci

      - name: Generate code
        run: just generate

      - name: Verify the deploy markers
        run: just markers

      - name: Analyze, format and test
        run: just check

      - name: Build the site
        run: just build

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/jaspr
          if-no-files-found: error
          retention-days: 7

      - name: Upload the deploy context
        uses: actions/upload-artifact@v7
        with:
          name: deploy-context
          path: |
            functions
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://damian-molinski.dev/
    steps:
      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: build/jaspr

      - name: Download the deploy context
        uses: actions/download-artifact@v8
        with:
          name: deploy-context

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        env:
          COMMIT_HASH: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/jaspr
            --project-name=portfolio
            --branch=main
            --commit-hash="$COMMIT_HASH"
            --commit-message="$COMMIT_MESSAGE"
