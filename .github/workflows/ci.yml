name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DART_SDK: 3.13.2

jobs:
  check:
    name: Analyze, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: extractions/setup-just@v4

      - uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ env.DART_SDK }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ env.DART_SDK }}-

      - name: Install the Jaspr CLI
        run: |
          dart pub global activate jaspr_cli 0.23.4
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - run: dart pub get
      - run: npm ci

      - run: just markers

      - run: just check

      - run: just build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: build/jaspr
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: deploy-context
          path: |
            functions
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://damian-molinski.dev/
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: build/jaspr

      - uses: actions/download-artifact@v8
        with:
          name: deploy-context

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy build/jaspr
            --project-name=portfolio
            --branch=main
            --commit-hash=${{ github.sha }}
