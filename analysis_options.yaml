include: package:lints/recommended.yaml

analyzer:
  errors:
    # Dart 3.13 private named parameters: `required this._client` is still called as `client:`,
    # so a private field needs no initializer list. Gated, not advisory.
    prefer_initializing_formals: error

plugins:
  jaspr_lints:
    version: ^0.7.2
    diagnostics:
      prefer_html_components: true
      sort_children_last: true
      styles_ordering: true

formatter:
  page_width: 120
  trailing_commas: preserve

