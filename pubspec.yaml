name: portfolio
description: Personal static portfolio web site
version: 0.0.1
publish_to: none
repository: https://github.com/damian-molinski/portfolio

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4
  # Browser APIs for the two @client components. The `universal_web` variant (not `web`) is what
  # static mode needs: it stubs the same API on the VM, so `lib/app.dart`'s import graph still
  # compiles for the server during pre-rendering.
  universal_web: ^1.1.1
  # Pure Dart, so both halves of the dual compilation take them. `jaspr_bloc` would have supplied
  # the provider and builder, but it pins `jaspr: ^0.22.0` and this project is on ^0.23.4; the
  # binding layer in `lib/state/` is hand-rolled instead.
  bloc: ^9.2.1
  get_it: ^9.2.1
  # Value equality for the cubit states. `ContactState` carries a Map, and without it `emit` fires
  # on every keystroke.
  equatable: ^2.0.7

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.4
  lints: ^5.0.0
  test: ^1.25.0

jaspr:
  mode: static
