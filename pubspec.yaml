name: portfolio
description: Personal static portfolio web site
version: 0.0.1
publish_to: none
repository: https://github.com/damian-molinski/portfolio

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4
  universal_web: ^1.1.1
  bloc: ^9.2.1
  get_it: ^9.2.1
  equatable: ^2.0.7
  http: ^1.6.0

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  crypto: ^3.0.7
  html: ^0.15.6
  jaspr_builder: ^0.23.4
  # Pinned exactly: jaspr_test requires the jaspr it ships with, not a range.
  jaspr_test: 0.23.4
  lints: ^5.0.0
  test: ^1.25.0

jaspr:
  mode: static
