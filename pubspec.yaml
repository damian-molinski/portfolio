name: portfolio
description: Personal static portfolio web site
version: 0.0.1
publish_to: none
repository: https://github.com/damian-molinski/portfolio

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.4
  # Browser APIs for the two @client components. The `universal_web` variant (not `web`) is what
  # static mode needs: it stubs the same API on the VM, so `lib/app.dart`'s import graph still
  # compiles for the server during pre-rendering.
  universal_web: ^1.1.1

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.4
  lints: ^5.0.0

jaspr:
  mode: static
